# .github/workflows/master_orchestrator.yml
name: Brasil Calculadoras Master Multiagent Orchestrator & SRE

on:
  schedule:
    # Disparo diário às 08:45 AM Horário de Pernambuco/Brasília (UTC-3) -> 11:45 AM UTC
    - cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Executar em modo simulado (Dry-Run)?'
        type: boolean
        required: false
        default: false
      skip_heal:
        description: 'Pular rotinas de autocura (Skip Healing)?'
        type: boolean
        required: false
        default: false

jobs:
  orchestrate-ecosystem:
    name: Orquestração Diária SRE dos 7 Subagentes (Brasil Calculadoras)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Master Orchestrator & SRE Engine
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'alessandrooliveirape@gmail.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VITE_ADSENSE_PUB_ID: ${{ secrets.VITE_ADSENSE_PUB_ID || 'ca-pub-8160658026927094' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.skip_heal }}" = "true" ]; then
            ARGS="$ARGS --skip-heal"
          fi
          npx tsx scripts/master_orchestrator.ts $ARGS

      - name: Commit e Push se houver autocura em assets locais
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml public/ads.txt public/api/
          git diff --staged --quiet || (git commit -m "chore(sre): autocura de sitemap e ads.txt pelo Master Orchestrator [skip ci]" && git push)

